{% extends 'base.html' %}
{% block title %}Delete Account{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto mt-10">
    <div class="bg-white shadow sm:rounded-lg border border-red-200">
        <div class="px-4 py-5 sm:p-6">
            <h3 class="text-lg leading-6 font-medium text-gray-900">
                Delete Account
            </h3>
            <div class="mt-2 max-w-xl text-sm text-gray-500">
                <p>
                    Are you sure you want to delete this Account? This action cannot be undone.
                </p>
                <p class="mt-2 font-bold text-gray-700">{{ account }}</p>
            </div>
            <div class="mt-5">
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="inline-flex items-center justify-center px-4 py-2 border border-transparent font-medium rounded-md text-red-700 bg-red-100 hover:bg-red-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 sm:text-sm">
                        Confirm Delete
                    </button>
                    <a href="{% url 'accounts:account-list' %}" class="ml-3 inline-flex items-center justify-center px-4 py-2 border border-gray-300 font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:text-sm">
                        Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

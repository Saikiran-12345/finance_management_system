{% extends 'base.html' %}
{% block title %}SavingsGoal Details{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">SavingsGoal Details</h1>
        <div>
            <a href="{% url 'savings:savingsgoal-update' savingsgoal.pk %}" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded mr-2 transition duration-300">Edit</a>
            <a href="{% url 'savings:savingsgoal-delete' savingsgoal.pk %}" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition duration-300">Delete</a>
        </div>
    </div>
    <div class="bg-white shadow overflow-hidden sm:rounded-lg border border-gray-200">
        <div class="px-4 py-5 sm:px-6">
            <h3 class="text-lg leading-6 font-medium text-gray-900">Information</h3>
        </div>
        <div class="border-t border-gray-200">
            <dl>
                <div class="bg-gray-50 px-4 py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
                    <dt class="text-sm font-medium text-gray-500">ID</dt>
                    <dd class="mt-1 text-sm text-gray-900 sm:mt-0 sm:col-span-2">{{ savingsgoal.id }}</dd>
                </div>
                <div class="bg-white px-4 py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
                    <dt class="text-sm font-medium text-gray-500">Details</dt>
                    <dd class="mt-1 text-sm text-gray-900 sm:mt-0 sm:col-span-2">{{ savingsgoal }}</dd>
                </div>
                <!-- Additional fields can be added here manually later -->
            </dl>
        </div>
    </div>
    <div class="mt-6">
        <a href="{% url 'savings:savingsgoal-list' %}" class="text-blue-600 hover:text-blue-800 font-medium">&larr; Back to SavingsGoals list</a>
    </div>
</div>
{% endblock %}
